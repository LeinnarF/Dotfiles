conky.config = {
	-- Output
	out_to_x = false,
	out_to_wayland = true,       -- Required for native Wayland
	background = true,
	double_buffer = true,

	-- Window
	own_window = true,
	own_window_type = 'desktop',
	own_window_argb_visual = true,
	own_window_argb_value = 150,  -- Transparency (0-255)
	own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

	-- Layout
	alignment = 'middle_left',
	gap_x = 30,
	-- gap_y = 80,
	minimum_width = 250,
	minimum_height = 0,
	border_inner_margin = 15,

	-- Font & colors
	font = 'JetBrains Mono:size=12',
	default_color = '#c0caf5',
	draw_shades = false,
	draw_outline = false,
	draw_borders = false,

	color0 = '#9ece6a',		-- Green
	color1 = '#f7768e',		-- Red
	color2 = '#7aa2f7',		-- Blue
	color3 = '#e0af68',		-- Orange
	color4 = '#bb9af7',		-- Purple
	color5 = '#7dcfff',		-- Cyan
	color6 = '#414868',		-- Comment
	color7 = '#c0caf5',		-- White

	-- Intervals
	update_interval = 2.0,
	cpu_avg_samples = 2,
	net_avg_samples = 2,
};

conky.text = [[
${font JetBrains Mono Nerd Font:size=60}${alignc}${time %H:%M}
${voffset -60}${font JetBrains Mono Nerd Font:size=13}${alignc}${time %A, %b %d %Y}${font}

${color0}SYSTEM ${color6}${hr 1}${color}
Host:      ${nodename}
User:      ${user_names}
Kernel:    ${kernel}
Uptime:    ${uptime}

${color0}CPU ${color6}${hr 1}${color}
Usage:     ${cpu cpu0}%  ${color6}${cpubar 6}${color}
Temp:      ${hwmon 0 temp 1}°C
Processes: ${processes}  Running: ${running_processes}

${color0}MEMORY ${color6}${hr 1}${color}
RAM:  ${mem} / ${memmax}
${color6}${membar 6}${color}

${color0}DISK ${color6}${hr 1}${color}
Root: ${fs_used /} / ${fs_size /}
${color6}${fs_bar 6 /}${color}
FileStorage: ${fs_used /mnt/FileStorage} / ${fs_size /mnt/FileStorage}
${color6}${fs_bar 6 /mnt/FileStorage}${color}

${color0}NETWORK ${color6}${hr 1}${color} ${if_up enp5s0}
${color2}Up: ${color}${upspeed enp5s0}    ${color3}Down: ${color}${downspeed enp5s0}${else}No internet connection${endif}


${color0}TOP PROCESSES ${color6}${hr 1}${font JetBrains Mono Nerd Font:size=11}
${top_mem name 1}   ${top_mem mem_res 1}  ${top_mem mem 1}%
${top_mem name 2}   ${top_mem mem_res 2}  ${top_mem mem 2}%
${top_mem name 3}   ${top_mem mem_res 3}  ${top_mem mem 3}%
${top_mem name 4}   ${top_mem mem_res 4}  ${top_mem mem 4}%
${top_mem name 5}   ${top_mem mem_res 5}  ${top_mem mem 5}%
]];
