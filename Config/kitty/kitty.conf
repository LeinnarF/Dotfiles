# Theme
include ./theme/tokyo-nights.conf

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
text_composition_strategy legacy

color_mode       true

# Window settings
window_padding_width 15
background_opacity 0.99
window_border_width 1.0
draw_minimal_borders no
background_blur 1

# Decorations
hide_window_decorations no

# Cursor
cursor_shape beam
cursor_blink_interval -1


# Scrollback
scrollback_lines 100

# Tabs
tab_bar_style powerline

tab_powerline_style slanted
tab_separator " "
tab_bar_edge top

enabled_layouts splits

# key bindings (closest kitty equivalents)
map alt+y copy_to_clipboard
map alt+p paste_from_clipboard
map ctrl+backspace send_text all \x17

map ctrl+\ launch --location=vsplit --cwd=current
map ctrl+| launch --location=hsplit --cwd=current

map ctrl+shift+right next_window
map ctrl+shift+left previous_window

map ctrl+shift+l next_window
map ctrl+shift+j previous_window

map alt+j scroll_line_down
map alt+k scroll_line_up

map ctrl+shift+tab next_window
map ctrl+shift+n launch --cwd=current --type=os-window
