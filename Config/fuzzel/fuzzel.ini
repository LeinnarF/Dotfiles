# --- Main Settings ---
font=JetBrains Mono:size=14
dpi-aware=auto

prompt="❯ "

terminal=foot
icon-theme=Tela
icons-enabled=yes

hide-prompt=yes

lines=10
width=50

line-height=25

horizontal-pad=10
vertical-pad=10
inner-pad=5

y-margin=250
anchor=top

layer=top
exit-on-keyboard-focus-loss=yes

[colors]
background=#1a1b26fa
text=#414868ff
match=#f7768eff
selection=#41486800
selection-text=#c0caf5ff
selection-match=#9ece6aff
border=#c0caf5ff
prompt=#9ece6aff
input=#c0caf5ff
message=#7aa2f7ff
# message=#9ece6aff

# --- Border Settings ---
[border]
radius=0


# --- Key Bindings ---
[key-bindings]
cancel=Escape Control+g Control+c
execute=Return KP_Enter

